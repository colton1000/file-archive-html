<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d1117">
<title>Super Projects</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<style>
:root{color-scheme:dark;--page:#0d1117;--panel:#161b22;--raised:#21262d;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--green:#3fb950;--blue:#58a6ff;--red:#f85149;--yellow:#d29922} [data-theme=light]{color-scheme:light;--page:#f6f8fa;--panel:#fff;--raised:#f3f4f6;--border:#d0d7de;--text:#1f2328;--muted:#656d76;--green:#1a7f37;--blue:#0969da;--red:#cf222e;--yellow:#9a6700}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font:14px system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}a{color:var(--blue)}[hidden]{display:none!important}.shell{min-height:100vh}.topbar{height:64px;display:flex;align-items:center;gap:18px;padding:0 24px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}.brand{font-size:19px;font-weight:800;color:var(--text);text-decoration:none}.brand span{color:var(--green)}.search{flex:1;max-width:540px;background:var(--page);border:1px solid var(--border);border-radius:6px;padding:8px 11px;color:var(--text)}.grow{flex:1}.btnx{border:1px solid var(--border);background:var(--raised);color:var(--text);border-radius:6px;padding:7px 12px;cursor:pointer}.btnx:hover{border-color:var(--muted)}.primary{background:var(--green);border-color:var(--green);color:#fff;font-weight:650}.danger{color:var(--red)}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 64px)}aside{padding:22px 14px;border-right:1px solid var(--border);background:var(--panel)}.navbtn{display:block;width:100%;text-align:left;margin:6px 0;padding:9px;border:0;border-radius:6px;background:transparent;color:var(--text);cursor:pointer}.navbtn.active,.navbtn:hover{background:var(--raised)}main{padding:34px;min-width:0}.wrap{max-width:1050px;margin:auto}.hero{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:25px}.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}.stat,.panel,.repo{background:var(--panel);border:1px solid var(--border);border-radius:8px}.stat{padding:15px}.stat strong{display:block;font-size:24px}.toolbar{display:flex;gap:10px;align-items:center;margin:20px 0;flex-wrap:wrap}.repo{padding:16px;margin:10px 0;cursor:pointer}.repo:hover{border-color:var(--muted)}.repo h3{margin:0 0 7px;font-size:16px}.badge{border:1px solid var(--border);border-radius:20px;padding:2px 8px;color:var(--muted);font-size:11px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px}.auth{min-height:100vh;display:grid;place-items:center;padding:18px}.authbox{width:min(420px,100%);padding:27px}.field{display:block;width:100%;margin:7px 0 14px;padding:9px;background:var(--page);color:var(--text);border:1px solid var(--border);border-radius:6px}.tabs{display:flex;gap:8px;margin:18px 0}.message{padding:10px;border:1px solid var(--red);color:var(--red);border-radius:6px;margin:10px 0}.modalx{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:16px;z-index:10}.modalcard{width:min(650px,100%);max-height:90vh;overflow:auto;padding:22px}.rowx{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.filelist{border:1px solid var(--border);border-radius:7px;overflow:hidden;margin-top:18px}.file{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--border)}.file:last-child{border:0}.file button{background:none;border:0;color:var(--blue);cursor:pointer;text-align:left}.file .actions{margin-left:auto}.readme{padding:18px;white-space:pre-wrap;line-height:1.55}.lang{font-size:12px;color:var(--muted)}code{color:var(--text)}
@media(max-width:720px){.layout{grid-template-columns:1fr}aside{display:none}main{padding:20px 12px}.cards{grid-template-columns:1fr}.topbar{padding:0 12px}.hero{align-items:flex-start;flex-direction:column}.search{min-width:0}.user-text{display:none}}
</style>
</head>
<body>
<section id="auth" class="auth"><form id="authForm" class="panel authbox"><a class="brand" href="#">super<span>projects</span></a><h1 id="authTitle" class="h3 mt-4">Sign in</h1><div class="tabs"><button type="button" class="btnx primary" data-mode="login">Sign in</button><button type="button" class="btnx" data-mode="register">Create account</button></div><label>Username<input id="username" class="field" required pattern="[A-Za-z0-9_-]{3,24}" autocomplete="username"></label><label>Password<input id="password" class="field" type="password" required minlength="12" autocomplete="current-password"></label><div id="authMsg" class="message" hidden></div><button class="btnx primary" type="submit">Continue</button></form></section>
<div id="app" class="shell" hidden><header class="topbar"><a class="brand" href="#" data-page="mine">super<span>projects</span></a><input id="search" class="search" type="search" placeholder="Search projects, owners, descriptions..."><span class="grow"></span><button id="theme" class="btnx" title="Toggle theme">◐</button><span id="who" class="user-text muted"></span><button id="logout" class="btnx">Sign out</button></header><div class="layout"><aside><button class="btnx primary w-100 mb-3" id="newRepo">＋ New repository</button><button class="navbtn active" data-page="mine">My repositories</button><button class="navbtn" data-page="explore">Explore public projects</button><button class="navbtn" id="xmlDownload">Download my XML</button></aside><main><div class="wrap"><section class="hero"><div><div class="muted">YOUR CREATIVE HOME</div><h1 id="pageTitle">Your repositories</h1><p id="pageSub" class="muted">Create, upload, share, and download projects.</p></div><button class="btnx primary" id="newRepo2">New repository</button></section><section class="cards"><div class="stat"><span class="muted">Repositories</span><strong id="total">0</strong></div><div class="stat"><span class="muted">Public</span><strong id="pub">0</strong></div><div class="stat"><span class="muted">Languages</span><strong id="langs">0</strong></div></section><div class="toolbar"><select id="visibility" class="field" style="width:auto;margin:0"><option value="all">All visibility</option><option value="public">Public</option><option value="private">Private</option></select><select id="language" class="field" style="width:auto;margin:0"><option value="all">All languages</option></select></div><section id="repos"></section><p id="empty" class="panel p-4 muted" hidden>No repositories found.</p></div></main></div></div>
<div id="repoModal" class="modalx" hidden><form id="repoForm" class="panel modalcard"><div class="rowx"><h2 class="h4 m-0">Create repository</h2><span class="grow"></span><button type="button" class="btnx" data-close>×</button></div><label>Repository name<input name="name" class="field" required pattern="[A-Za-z0-9._-]{1,60}"></label><label>Description<textarea name="description" class="field" maxlength="300"></textarea></label><label>Primary language<select name="language" id="newLanguage" class="field"></select></label><label>Visibility<select name="visibility" class="field"><option value="public">Public</option><option value="private">Private</option></select></label><label><input type="checkbox" name="readme" checked> Add README.md</label><label class="ms-3"><input type="checkbox" name="ignore" checked> Add .fileignore</label><div class="mt-3"><button class="btnx primary">Create repository</button></div></form></div>
<div id="detailModal" class="modalx" hidden><div class="panel modalcard"><div class="rowx"><h2 id="detailName" class="h4 m-0"></h2><span id="detailVisibility" class="badge"></span><span class="grow"></span><button class="btnx" data-close>×</button></div><p id="detailMeta" class="muted mt-2"></p><div class="rowx"><label class="btnx">Upload files/folder<input id="upload" type="file" multiple webkitdirectory directory hidden></label><button id="uploadFiles" class="btnx">Choose files</button><button id="downloadZip" class="btnx primary">Download ZIP</button><button id="deleteRepo" class="btnx danger">Delete</button></div><div id="files" class="filelist"></div><section id="readme" class="panel readme mt-3" hidden></section></div></div>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
<script>
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const colors={JavaScript:"#f1e05a",TypeScript:"#3178c6",Python:"#3572A5",HTML:"#e34c26",CSS:"#563d7c",Java:"#b07219",C:"#555555","C++":"#f34b7d","C#":"#178600",Go:"#00ADD8",Rust:"#dea584",Ruby:"#701516",PHP:"#4F5D95",Swift:"#F05138",Kotlin:"#A97BFF",Dart:"#00B4AB",Shell:"#89e051",PowerShell:"#012456",Vue:"#41b883",Svelte:"#ff3e00",Lua:"#000080",R:"#198CE7",Other:"#8b949e"};
let me=null,page="mine",repos=[],selected=null;
function msg(t){const e=$("#authMsg");e.textContent=t;e.hidden=false} async function api(url,opt={}){const r=await fetch(url,{credentials:"same-origin",...opt,headers:{...(opt.body instanceof FormData?{}:{"Content-Type":"application/json"}),...(opt.headers||{})}});if(!r.ok){let x={};try{x=await r.json()}catch{}throw Error(x.error||`Request failed (${r.status})`)}return r.headers.get("content-type")?.includes("json")?r.json():r}
Object.keys(colors).forEach(x=>{$("#newLanguage").add(new Option(x,x));$("#language").add(new Option(x,x))});
async function boot(){try{const x=await api("/api/me");if(x.user){me=x.user;showApp();await load()}}catch(e){msg(e.message)}}
function showApp(){$("#auth").hidden=true;$("#app").hidden=false;$("#who").textContent=me.username}
async function load(){const q=new URLSearchParams({scope:page,q:$("#search").value,visibility:$("#visibility").value,language:$("#language").value});repos=(await api("/api/projects?"+q)).projects;render()}
function render(){$("#pageTitle").textContent=page==="mine"?"Your repositories":"Explore public projects";$("#pageSub").textContent=page==="mine"?"Your code, files, and ideas in one place.":"Discover projects shared by other people.";$("#total").textContent=repos.length;$("#pub").textContent=repos.filter(r=>r.visibility==="public").length;$("#langs").textContent=new Set(repos.map(r=>r.language).filter(Boolean)).size;$("#repos").replaceChildren(...repos.map(card));$("#empty").hidden=!!repos.length;$$('[data-page]').forEach(b=>b.classList.toggle("active",b.dataset.page===page))}
function card(r){const a=document.createElement("article");a.className="repo";const d=document.createElement("div");d.className="rowx";const h=document.createElement("h3");h.textContent=`${r.owner} / ${r.name}`;const b=document.createElement("span");b.className="badge";b.textContent=r.visibility;d.append(h,b);const p=document.createElement("p");p.className="muted mb-2";p.textContent=r.description||"No description";const l=document.createElement("div");l.className="lang";l.innerHTML=`<span class="dot" style="background:${colors[r.language]||colors.Other}"></span>${escapeHtml(r.language||"Other")} · ${r.file_count} files · updated ${new Date(r.updated).toLocaleString()}`;a.append(d,p,l);a.onclick=()=>openRepo(r.owner,r.name);return a}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function openRepo(owner,name){selected=await api(`/api/projects/${encodeURIComponent(owner)}/${encodeURIComponent(name)}`);$("#detailName").textContent=`${owner} / ${name}`;$("#detailVisibility").textContent=selected.visibility;$("#detailMeta").textContent=`${selected.language} · ${selected.description||"No description"}`;const own=owner===me.username;$("#upload").parentElement.hidden=!own;$("#uploadFiles").hidden=!own;$("#deleteRepo").hidden=!own;$("#downloadZip").onclick=()=>location.href=`/api/projects/${encodeURIComponent(owner)}/${encodeURIComponent(name)}/zip`;renderFiles(selected.files,owner,name);$("#readme").hidden=!selected.readme;$("#readme").textContent=selected.readme||"";$("#detailModal").hidden=false}
function renderFiles(files,owner,name){const box=$("#files");box.replaceChildren();if(!files.length){box.textContent="No files yet.";return}files.forEach(f=>{const row=document.createElement("div");row.className="file";const btn=document.createElement("button");btn.textContent=f.path;btn.title="Download file";btn.onclick=()=>location.href=`/api/projects/${encodeURIComponent(owner)}/${encodeURIComponent(name)}/files/${f.path.split('/').map(encodeURIComponent).join('/')}`;const s=document.createElement("span");s.className="muted actions";s.textContent=`${f.size} bytes`;row.append(btn,s);box.append(row)})}
$$('[data-close]').forEach(b=>b.onclick=()=>b.closest(".modalx").hidden=true);[$("#newRepo"),$("#newRepo2")].forEach(b=>b.onclick=()=>$("#repoModal").hidden=false);
$$('[data-mode]').forEach(b=>b.onclick=()=>{$$('[data-mode]').forEach(x=>x.classList.remove("primary"));b.classList.add("primary");$("#authForm").dataset.mode=b.dataset.mode;$("#authTitle").textContent=b.dataset.mode==="register"?"Create account":"Sign in"});
$("#authForm").dataset.mode="login";$("#authForm").onsubmit=async e=>{e.preventDefault();try{const x=await api(`/api/auth/${e.currentTarget.dataset.mode}`,{method:"POST",body:JSON.stringify({username:$("#username").value,password:$("#password").value})});me=x.user;showApp();await load()}catch(x){msg(x.message)}};
$("#repoForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),x=Object.fromEntries(f);x.readme=f.has("readme");x.ignore=f.has("ignore");try{await api("/api/projects",{method:"POST",body:JSON.stringify(x)});$("#repoModal").hidden=true;e.currentTarget.reset();page="mine";await load()}catch(e){alert(e.message)}};
$("#uploadFiles").onclick=()=>{const i=$("#upload");i.removeAttribute("webkitdirectory");i.removeAttribute("directory");i.click()};$("#upload").onchange=async e=>{const fd=new FormData();[...e.target.files].forEach(f=>fd.append("files",f,f.webkitRelativePath||f.name));try{await api(`/api/projects/${encodeURIComponent(me.username)}/${encodeURIComponent(selected.name)}/upload`,{method:"POST",body:fd});await openRepo(me.username,selected.name);await load()}catch(x){alert(x.message)}e.target.value=""};
$("#deleteRepo").onclick=async()=>{if(!confirm(`Delete ${selected.name}?`))return;await api(`/api/projects/${encodeURIComponent(me.username)}/${encodeURIComponent(selected.name)}`,{method:"DELETE"});$("#detailModal").hidden=true;await load()};
$("#logout").onclick=async()=>{await api("/api/auth/logout",{method:"POST",body:"{}"});location.reload()};$("#xmlDownload").onclick=()=>location.href="/api/account.xml";$$('[data-page]').forEach(b=>b.onclick=e=>{e.preventDefault();page=b.dataset.page;load()});let timer;$("#search").oninput=()=>{clearTimeout(timer);timer=setTimeout(load,180)};$("#visibility").onchange=load;$("#language").onchange=load;$("#theme").onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==="dark"?"light":"dark"};boot();
</script>
</body></html>
